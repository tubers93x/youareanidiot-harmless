<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are an idiot! (dot harmless)</title>
    <meta name="google" content="notranslate">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: relative;
            /* Mantiene la flecha normal del mouse en toda la pantalla */
            cursor: default; 
            user-select: none;
        }

        /* Altavoz fijo arriba a la izquierda */
        .audio-control {
            position: absolute;
            top: 20px;
            left: 20px;
            /* Mantiene la flecha normal del mouse sobre el altavoz */
            cursor: default; 
            transition: transform 0.2s ease;
            z-index: 10;
        }

        .audio-control:hover {
            transform: scale(1.1);
        }

        .audio-control svg {
            width: 50px;
            height: 50px;
            fill: #000000;
            filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.8)); 
        }

        /* Contenedor del GIF */
        .gif-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* El GIF ocupa todo el espacio hasta chocar con los bordes */
        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }
    </style>
</head>
<body class="notranslate" onclick="playOnFirstClick(event)">

    <!-- Botón del Altavoz -->
    <div class="audio-control" id="speakerButton" onclick="toggleAudio(event)">
        <svg id="speakerIcon" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </div>

    <!-- Imagen animada a pantalla completa -->
    <div class="gif-container">
        <img src="You_Are_An_Idiot_screen.gif" alt="You are an idiot">
    </div>

    <!-- Audio en bucle -->
    <audio id="myAudio" src="you-are-an-idiot.mp3" loop></audio>

    <script>
        const audio = document.getElementById('myAudio');
        const icon = document.getElementById('speakerIcon');
        let initialActivationDone = false;

        const soundOnPath = "M3 9v6h4l5 5v-16l-5 5h-4zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";
        const soundOffPath = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";

        function playOnFirstClick(event) {
            if (!initialActivationDone) {
                initialActivationDone = true;
                audio.play().then(() => {
                    icon.querySelector('path').setAttribute('d', soundOnPath);
                }).catch(error => {
                    console.log("Error al reproducir:", error);
                    initialActivationDone = false; 
                });
            }
        }

        function toggleAudio(event) {
            event.stopPropagation(); 
            initialActivationDone = true; 

            if (audio.paused) {
                audio.play();
                icon.querySelector('path').setAttribute('d', soundOnPath);
            } else {
                audio.pause();
                icon.querySelector('path').setAttribute('d', soundOffPath);
            }
        }
    </script>

</body>
</html>
