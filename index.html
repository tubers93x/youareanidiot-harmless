<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are an idiot! (dot github)</title>
    <style>
        /* Estilos generales y animación del fondo intermitente */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            user-select: none;
            /* Parpadeo configurado exactamente a 666 milisegundos */
            animation: flash 0.666s infinite;
        }

        @keyframes flash {
            0% { background-color: #ffffff; color: #000000; }
            50% { background-color: #ffffff; color: #000000; }
            51% { background-color: #000000; color: #ffffff; }
            100% { background-color: #000000; color: #ffffff; }
        }

        /* Botón del altavoz arriba a la izquierda */
        .volume-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .volume-btn:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.8);
        }

        .volume-btn.active {
            background: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }

        /* Contenedor del texto principal */
        .meme-container {
            text-align: center;
        }

        /* Animación del texto rebotando y fuente TIMES NEW ROMAN */
        h1 {
            font-family: "Times New Roman", Times, serif; /* SE CAMBIÓ LA FUENTE AQUÍ */
            font-size: 5.5rem; /* Un poco más grande para lucir mejor la fuente serif */
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            animation: bounce 0.666s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }

        /* Estilo para las 3 caritas */
        .faces {
            font-size: 4.5rem; 
            margin-top: 25px;
            font-weight: bold;
            letter-spacing: 10px; 
        }
    </style>
</head>
<body>

    <!-- Botón de Altavoz (Única fuente de sonido) -->
    <button class="volume-btn" id="beepBtn" onclick="toggleBeep()">🔈</button>

    <!-- Contenido del Meme -->
    <div class="meme-container">
        <h1>you are an idiot!</h1>
        <p class="faces">☺ ☺ ☺</p>
    </div>

    <script>
        let audioCtx = null;
        let beepOscillator = null; 
        let beepGain = null;

        // --- SISTEMA DEL ALTAVOZ ---
        function toggleBeep() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const btn = document.getElementById('beepBtn');

            if (beepOscillator === null) {
                // ACTIVAR PITIDO
                beepOscillator = audioCtx.createOscillator();
                beepGain = audioCtx.createGain();

                beepOscillator.type = 'sine'; 
                beepOscillator.frequency.value = 880; 
                beepGain.gain.setValueAtTime(0.1, audioCtx.currentTime); 

                beepOscillator.connect(beepGain);
                beepGain.connect(audioCtx.destination);
                
                beepOscillator.start();
                
                btn.innerText = '🔊';
                btn.classList.add('active');
            } else {
                // DESACTIVAR PITIDO
                beepOscillator.stop();
                beepOscillator.disconnect();
                beepOscillator = null;
                beepGain = null;

                btn.innerText = '🔈';
                btn.classList.remove('active');
            }
        }
    </script>
</body>
</html>
